    }

      transform-origin: bottom right;
      animation: foldSlide 3s cubic-bezier(0.77, 0, 0.175, 1) infinite;
    }

      background-color: #DFDEEB;
      animation-delay: 0s;
      z-index: 3;
    }

    /* Panel Two (#E2E1EE) */
    .panel-two {
      background-color: #E2E1EE;
      animation-delay: 0.5s;
      z-index: 2;
    }

      background-color: #FFFFFF;
      animation-delay: 1s;
      z-index: 1;
    }

    /* --- THE MECHANISM --- */
    /* A unique geometric fold and slide transition that runs on a loop */
    @keyframes foldSlide {
      0% {
        transform: translate(0, 0) scale(1);
